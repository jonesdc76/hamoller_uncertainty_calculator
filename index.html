<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asymmetry Uncertainty Calculator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8f9fa;
      color: #212529;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 750px;
      margin: 20px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    h1 { margin-top: 0; color: #1e3a8a; }
    .subtitle { color: #4b5563; margin-bottom: 25px; font-size: 1.1em; }
    .math-box { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 1.2em; background: #f3f4f6; padding: 10px 15px; border-radius: 6px; display: inline-block; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    .card { background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; }
    .card-title { font-weight: bold; margin-bottom: 15px; color: #374151; border-bottom: 2px solid #e5e7eb; padding-bottom: 5px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.95em; }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1em;
      margin-bottom: 15px;
    }
    .result-box {
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
      padding: 20px;
      border-radius: 0 8px 8px 0;
    }
    .metric-title { font-size: 0.9em; color: #1e40af; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .metric-value { font-size: 2.2em; font-weight: bold; color: #1e3a8a; margin: 5px 0; }
    .info-text { color: #4b5563; font-size: 1em; margin-top: 10px; line-height: 1.5; }
    .error { color: #dc2626; font-weight: 500; background: #fee2e2; padding: 12px; border-radius: 6px; border: 1px solid #fca5a5; }
  </style>
</head>
<body>

<div class="container">
  <h1>📊 Asymmetry & Runtime Calculator</h1>
  <div class="subtitle">Statistical metrics for rate asymmetry measurements.</div>
  
  <!-- Plain Text Math Formula Block -->
  <div class="math-box">
    A = (N1 - N2) / (N1 + N2) &nbsp;&nbsp;|&nbsp;&nbsp; &sigma;<sub>A</sub> = &sqrt;((1 - A<sup>2</sup>) / N)
  </div>

  <div class="grid">
    <!-- Settings Card -->
    <div class="card">
      <div class="card-title">⚙️ Configuration</div>
      
      <label for="mode">What do you want to find?</label>
      <select id="mode" onchange="toggleInputs(); calculate();">
        <option value="uncertainty">Relative Uncertainty (&sigma;<sub>A</sub> / A) given N</option>
        <option value="counts">Required Counts (N) given target uncertainty</option>
      </select>

      <label for="rate">Total Event Rate (R1 + R2) per second</label>
      <input type="number" id="rate" value="100" min="0.0001" step="any" oninput="calculate();">
    </div>

    <!-- Inputs Card -->
    <div class="card">
      <div class="card-title">📥 Inputs</div>
      
      <label for="inputA">Measured/Expected Asymmetry (A)</label>
      <input type="number" id="inputA" value="0.05" min="0" max="1" step="0.01" oninput="calculate();">

      <div id="groupN">
        <label for="inputN">Total Collected Events (N)</label>
        <input type="number" id="inputN" value="10000" min="1" step="1000" oninput="calculate();">
      </div>

      <div id="groupUnc" style="display:none;">
        <label for="inputUnc">Target Relative Uncertainty (&sigma;<sub>A</sub> / A)</label>
        <input type="number" id="inputUnc" value="0.02" min="0.000001" step="0.005" oninput="calculate();">
      </div>
    </div>
  </div>

  <!-- Output Box -->
  <div class="result-box">
    <div id="calc-results"></div>
  </div>
</div>

<script>
  function toggleInputs() {
    const mode = document.getElementById('mode').value;
    document.getElementById('groupN').style.display = mode === 'uncertainty' ? 'block' : 'none';
    document.getElementById('groupUnc').style.display = mode === 'counts' ? 'block' : 'none';
  }

  function formatTime(seconds) {
    if (seconds < 60) return `${seconds.toFixed(2)} seconds`;
    if (seconds < 3600) return `${seconds.toFixed(2)} seconds (~${(seconds/60).toFixed(2)} minutes)`;
    if (seconds < 86400) return `${(seconds/3600).toFixed(2)} hours (~${(seconds/86400).toFixed(2)} days)`;
    return `${(seconds/86400).toFixed(2)} days`;
  }

  function calculate() {
    const mode = document.getElementById('mode').value;
    const rate = parseFloat(document.getElementById('rate').value) || 100;
    const A = parseFloat(document.getElementById('inputA').value);
    const resultsDiv = document.getElementById('calc-results');

    if (isNaN(A) || A < 0 || A > 1) {
      resultsDiv.innerHTML = `<div class="error">Please enter a valid Asymmetry (A) between 0 and 1.</div>`;
      return;
    }

    if (mode === 'uncertainty') {
      const N = parseInt(document.getElementById('inputN').value);
      if (!N || N <= 0) {
        resultsDiv.innerHTML = `<div class="error">Total events (N) must be greater than 0.</div>`;
        return;
      }
      if (A === 0) {
        resultsDiv.innerHTML = `<div class="error">Asymmetry (A) cannot be exactly 0 when calculating relative uncertainty (&sigma;<sub>A</sub> / A) because it causes a division by zero.</div>`;
        return;
      }

      const sigma_A = Math.sqrt((1 - (A * A)) / N);
      const relUnc = sigma_A / A;
      const timeRequired = N / rate;

      resultsDiv.innerHTML = `
        <div class="metric-title">Relative Uncertainty (&sigma;<sub>A</sub> / A)</div>
        <div class="metric-value">${relUnc.toFixed(4)} (${(relUnc * 100).toFixed(2)}%)</div>
        <div class="info-text"><strong>Absolute Uncertainty (&sigma;<sub>A</sub>):</strong> ${sigma_A.toFixed(5)}</div>
        <div class="info-text">⏱️ <strong>Time required to collect ${N.toLocaleString()} events:</strong> ${formatTime(timeRequired)}</div>
      `;

    } else {
      const targetRel = parseFloat(document.getElementById('inputUnc').value);
      if (!targetRel || targetRel <= 0) {
        resultsDiv.innerHTML = `<div class="error">Target relative uncertainty must be greater than 0.</div>`;
        return;
      }
      if (A === 0) {
        resultsDiv.innerHTML = `<div class="error">Expected Asymmetry (A) must be greater than 0 to calculate target relative uncertainty thresholds.</div>`;
        return;
      }

      // Formula: N = (1-A^2) / (A^2 * target_rel^2)
      const N_required = Math.ceil((1 - (A * A)) / ((A * A) * (targetRel * targetRel)));
      const timeRequired = N_required / rate;

      resultsDiv.innerHTML = `
        <div class="metric-title">Required Total Events (N)</div>
        <div class="metric-value">${N_required.toLocaleString()}</div>
        <div class="info-text">⏱️ <strong>Required run time at specified rate:</strong> ${formatTime(timeRequired)}</div>
      `;
    }
  }

  // Initial load execution loop
  toggleInputs();
  calculate();
</script>

</body>
</html>
