<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Asymmetry Calculator</title>
    <!-- Use the new style.css filename -->
    <link rel="stylesheet" href="https://jsdelivr.net" />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Use type="module" to properly load the ESM script package -->
    <script type="module">
      import { mount } from "https://jsdelivr.net";

      fetch("./app.py")
        .then((response) => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.text();
        })
        .then((code) => {
          // Mount directly using the imported ESM mount function
          mount({
            requirements: ["numpy"],
            entrypoint: "app.py",
            files: {
              "app.py": code
            }
          }, document.getElementById("root"));
        })
        .catch((error) => {
          document.getElementById("root").innerHTML = `
            <div style="padding:20px;color:red;font-family:sans-serif;">
              <h3>Failed to load application script</h3>
              <p>${error.message}</p>
            </div>`;
        });
    </script>
  </body>
</html>
