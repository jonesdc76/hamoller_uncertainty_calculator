<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Asymmetry Calculator</title>
    <!-- Upgraded to a more modern, stable build of stlite -->
    <link rel="stylesheet" href="https://jsdelivr.net" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://jsdelivr.net"></script>
    <script>
      // Explicitly pull app.py relative to the current folder path
      const currentPath = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
      
      fetch("./app.py")
        .then((response) => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.text();
        })
        .then((code) => {
          stlite.mount({
            requirements: ["numpy"],
            entrypoint: "app.py",
            files: {
              "app.py": code
            }
          }, document.getElementById("root"));
        })
        .catch((error) => {
          document.getElementById("root").innerHTML = `<div style="padding:20px;color:red;"><h3>Failed to load application script</h3><p>${error.message}</p></div>`;
        });
    </script>
  </body>
</html>
